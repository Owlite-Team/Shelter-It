version: "3.8"

services:
    app:
        build:
          context: .
        container_name: shelter-it
        environment:
            SERVER_PORT: ${SERVER_PORT}
            DB_HOST: db
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
        env_file:
            -   ./.env
        depends_on:
            db:
                condition: service_healthy
        networks:
            - shelter-it-network

    db:
        image: postgres
        restart: always
        container_name: shelter-it-db
        env_file:
            - ./.env
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_USER: ${DB_USERNAME}
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - "5432:5432"
        volumes:
            - pg-data:/var/lib/postgresql/data
        networks:
            - shelter-it-network

volumes:
    pg-data:

networks:
    shelter-it-network:
